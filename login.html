<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | EcoTrack</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: #f1f6f1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 430px;
        background: white;
        border-radius: 17px;
        padding: 42px;
        box-shadow: 0 12px 40px rgba(25, 70, 40, 0.09);
      }

      .logo {
        text-align: center;
        margin-bottom: 35px;
      }

      .logo-icon {
        font-size: 42px;
      }

      .logo h1 {
        color: #205638;
        font-size: 31px;
        margin-top: 8px;
        font-weight: 800;
      }

      .logo p {
        color: #849087;
        font-size: 13px;
        margin-top: 9px;
        line-height: 1.6;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #354b3c;
        margin-bottom: 9px;
      }

      input {
        width: 100%;
        padding: 14px;
        border: 1px solid #dce6dd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }

      input:focus {
        border-color: #27804d;
        box-shadow: 0 0 0 3px rgba(39, 128, 77, 0.1);
      }

      .login-btn {
        width: 100%;
        padding: 15px;
        background: #247548;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 8px;
      }

      .login-btn:hover {
        background: #173f2c;
      }

      .login-btn:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .message {
        display: none;
        margin-top: 17px;
        padding: 12px;
        border-radius: 7px;
        font-size: 13px;
        text-align: center;
      }

      .error {
        display: block;
        background: #fff0ef;
        color: #b33d35;
      }

      .success {
        display: block;
        background: #eaf5ec;
        color: #247548;
      }

      .footer {
        text-align: center;
        color: #849087;
        font-size: 11px;
        margin-top: 30px;
        line-height: 1.7;
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 30px 23px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="logo">
        <div class="logo-icon">🌱</div>

        <h1>EcoTrack</h1>

        <p>
          Environmental Sustainability<br />
          Management System
        </p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="login-btn" id="loginButton">
          Login to EcoTrack
        </button>

        <div id="message" class="message"></div>
      </form>

      <div class="footer">
        © 2026 EcoTrack<br />
        Building a sustainable future together.
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        button.disabled = true;
        button.textContent = "Signing in...";

        message.className = "message";
        message.textContent = "";

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: email,
              password: password,
            }),
          });

          const result = await response.json();

          if (response.ok) {
            message.textContent = "Login successful! Redirecting...";
            message.className = "message success";

            window.location.href = "/dashboard";
          } else {
            message.textContent =
              result.error || result.message || "Invalid email or password";

            message.className = "message error";
          }
        } catch (error) {
          message.textContent = "Unable to connect to EcoTrack server.";
          message.className = "message error";
        } finally {
          button.disabled = false;
          button.textContent = "Login to EcoTrack";
        }
      });
    </script>
  </body>
</html>
